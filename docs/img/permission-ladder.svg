<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Permission resolution: overrides, groups by weight, default group, node default</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1A2028"/>

  <!-- request chip -->
  <rect x="70" y="90" width="310" height="54" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
  <text x="225" y="124" text-anchor="middle" fill="#4FC3F7" font-size="20" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">!spawn_wild Lamball 20</text>
  <line x1="380" y1="117" x2="475" y2="117" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ladder -->
  <g fill="#232B36" stroke="#3A4654" stroke-width="1.5">
    <rect x="485" y="85" width="310" height="64" rx="10"/>
    <rect x="485" y="225" width="310" height="64" rx="10"/>
    <rect x="485" y="365" width="310" height="64" rx="10"/>
    <rect x="485" y="505" width="310" height="64" rx="10"/>
  </g>
  <g fill="#C7D0DA" font-size="21" text-anchor="middle">
    <text x="640" y="124">player overrides</text>
    <text x="640" y="264">groups, by weight</text>
    <text x="640" y="404">default group</text>
    <text x="640" y="544">node default</text>
  </g>
  <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
    <line x1="640" y1="149" x2="640" y2="219"/>
    <line x1="640" y1="289" x2="640" y2="359"/>
    <line x1="640" y1="429" x2="640" y2="499"/>
  </g>

  <!-- constraint gate off the groups row -->
  <line x1="795" y1="257" x2="880" y2="257" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="890" y="210" width="330" height="94" rx="10" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
  <text x="1055" y="248" text-anchor="middle" fill="#FFB74D" font-size="18" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">where species in SheepBall,</text>
  <text x="1055" y="278" text-anchor="middle" fill="#FFB74D" font-size="18" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">Lamball and level &lt;= 20</text>

  <!-- allow / deny -->
  <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
    <line x1="1000" y1="304" x2="985" y2="370"/>
    <line x1="1110" y1="304" x2="1125" y2="370"/>
  </g>
  <rect x="915" y="378" width="130" height="48" rx="10" fill="#232B36" stroke="#66BB6A" stroke-width="2"/>
  <text x="980" y="409" text-anchor="middle" fill="#66BB6A" font-size="20">allow</text>
  <rect x="1065" y="378" width="130" height="48" rx="10" fill="#232B36" stroke="#EF5350" stroke-width="2"/>
  <text x="1130" y="409" text-anchor="middle" fill="#EF5350" font-size="20">deny</text>

  <!-- caption -->
  <rect x="400" y="632" width="480" height="50" rx="10" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="640" y="664" text-anchor="middle" fill="#8CA0B3" font-size="20">one answer for chat, mods and HTTP</text>
</svg>
