<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>One manifest generates the chat, HTTP and Lua surfaces</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1A2028"/>

  <!-- manifest -->
  <rect x="90" y="300" width="250" height="100" rx="12" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
  <text x="215" y="360" text-anchor="middle" fill="#FFB74D" font-size="26" font-weight="600">one manifest</text>

  <!-- three surfaces -->
  <g fill="#232B36" stroke="#4FC3F7" stroke-width="2">
    <rect x="520" y="130" width="360" height="70" rx="10"/>
    <rect x="520" y="315" width="360" height="70" rx="10"/>
    <rect x="520" y="500" width="360" height="70" rx="10"/>
  </g>
  <g fill="#4FC3F7" font-size="20" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
    <text x="700" y="173">!give_item PalSphere 5</text>
    <text x="700" y="358">POST /api/bridge/call</text>
    <text x="700" y="543">pal.call(...)</text>
  </g>
  <g fill="#8CA0B3" font-size="16" text-anchor="middle">
    <text x="700" y="122">in-game chat</text>
    <text x="700" y="307">HTTP, any language</text>
    <text x="700" y="492">a mod, in Lua</text>
  </g>

  <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
    <line x1="340" y1="320" x2="512" y2="172"/>
    <line x1="340" y1="350" x2="512" y2="350"/>
    <line x1="340" y1="380" x2="512" y2="528"/>
  </g>

  <!-- the same action -->
  <rect x="1000" y="310" width="220" height="80" rx="12" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1110" y="358" text-anchor="middle" fill="#C7D0DA" font-size="22">the same action</text>
  <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
    <line x1="880" y1="172" x2="993" y2="325"/>
    <line x1="880" y1="350" x2="993" y2="350"/>
    <line x1="880" y1="528" x2="993" y2="375"/>
  </g>

  <!-- caption -->
  <rect x="415" y="632" width="450" height="50" rx="10" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="640" y="664" text-anchor="middle" fill="#8CA0B3" font-size="20">generated, never hand-synced</text>
</svg>
