<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Events out, actions in: two files on disk between the game and your program</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1A2028"/>

  <!-- game server -->
  <rect x="80" y="180" width="300" height="360" rx="12" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="230" y="225" text-anchor="middle" fill="#C7D0DA" font-size="22">game server</text>
  <rect x="120" y="300" width="220" height="90" rx="10" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
  <text x="230" y="355" text-anchor="middle" fill="#FFB74D" font-size="24" font-weight="600">Palladium</text>

  <!-- your program -->
  <rect x="960" y="180" width="250" height="360" rx="12" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1085" y="365" text-anchor="middle" fill="#C7D0DA" font-size="22">your program</text>

  <!-- events lane -->
  <rect x="520" y="230" width="310" height="70" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
  <text x="675" y="273" text-anchor="middle" fill="#4FC3F7" font-size="20" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">bridge-events.jsonl</text>
  <line x1="380" y1="265" x2="512" y2="265" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>
  <text x="446" y="250" text-anchor="middle" fill="#8CA0B3" font-size="18">events</text>
  <line x1="830" y1="265" x2="952" y2="265" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>

  <!-- actions lane -->
  <rect x="520" y="450" width="310" height="70" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
  <text x="675" y="493" text-anchor="middle" fill="#4FC3F7" font-size="20" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">bridge-actions.jsonl</text>
  <line x1="960" y1="485" x2="838" y2="485" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>
  <text x="899" y="470" text-anchor="middle" fill="#8CA0B3" font-size="18">actions</text>
  <line x1="520" y1="485" x2="388" y2="485" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>

  <!-- caption -->
  <rect x="345" y="632" width="590" height="50" rx="10" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="640" y="664" text-anchor="middle" fill="#8CA0B3" font-size="20">two files on disk — any language, no sockets needed</text>
</svg>
