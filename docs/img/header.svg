<svg viewBox="0 0 1300 372" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Palladium header</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1300" height="372" fill="#1A2028"/>

  <!-- wordmark, left -->
  <text x="90" y="185" fill="#C7D0DA" font-size="86" font-weight="700" letter-spacing="1">Palladium</text>
  <rect x="93" y="210" width="418" height="8" rx="4" fill="#FFB74D"/>
  <text x="93" y="265" fill="#8CA0B3" font-size="27">server-side Palworld modding — a mod is one file</text>

  <!-- three doors, one framework -->
  <g opacity="0.9">
    <rect x="740" y="48" width="200" height="60" rx="10" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
    <text x="840" y="86" text-anchor="middle" fill="#FFB74D" font-size="22" font-weight="600">mod.lua</text>

    <rect x="740" y="156" width="200" height="60" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
    <text x="840" y="194" text-anchor="middle" fill="#4FC3F7" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace">!spawn</text>

    <rect x="740" y="264" width="200" height="60" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
    <text x="840" y="302" text-anchor="middle" fill="#4FC3F7" font-size="21" font-family="ui-monospace, Menlo, Consolas, monospace">HTTP + token</text>

    <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
      <line x1="940" y1="78" x2="1042" y2="160"/>
      <line x1="940" y1="186" x2="1042" y2="186"/>
      <line x1="940" y1="294" x2="1042" y2="212"/>
    </g>

    <rect x="1050" y="141" width="190" height="90" rx="12" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
    <text x="1145" y="195" text-anchor="middle" fill="#FFB74D" font-size="26" font-weight="600">Palladium</text>
  </g>
</svg>
