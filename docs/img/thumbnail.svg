<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Palladium — server-side Palworld modding</title>
  <rect width="1280" height="720" fill="#1A2028"/>

  <!-- faint architecture scatter -->
  <g opacity="0.3">
    <g fill="#232B36" stroke="#3A4654" stroke-width="1.5">
      <rect x="90" y="90" width="170" height="60" rx="10"/>
      <rect x="330" y="160" width="130" height="50" rx="10"/>
      <rect x="1010" y="110" width="180" height="60" rx="10"/>
      <rect x="880" y="220" width="120" height="50" rx="10"/>
      <rect x="120" y="540" width="150" height="55" rx="10"/>
      <rect x="360" y="600" width="120" height="45" rx="10"/>
      <rect x="990" y="560" width="170" height="60" rx="10"/>
      <rect x="800" y="630" width="110" height="45" rx="10"/>
    </g>
    <g stroke="#3A4654" stroke-width="1.5">
      <line x1="260" y1="120" x2="330" y2="180"/>
      <line x1="460" y1="185" x2="560" y2="200"/>
      <line x1="1010" y1="140" x2="920" y2="220"/>
      <line x1="270" y1="565" x2="360" y2="615"/>
      <line x1="480" y1="620" x2="580" y2="600"/>
      <line x1="990" y1="590" x2="910" y2="645"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="640" y="360" text-anchor="middle" fill="#C7D0DA" font-size="130" font-weight="700" letter-spacing="2">Palladium</text>
  <rect x="345" y="395" width="590" height="10" rx="5" fill="#FFB74D"/>
  <text x="640" y="470" text-anchor="middle" fill="#8CA0B3" font-size="38">server-side Palworld modding</text>

  <!-- Pal-Up chip -->
  <rect x="1080" y="640" width="150" height="52" rx="10" fill="#232B36" stroke="#4FC3F7" stroke-width="2"/>
  <text x="1155" y="674" text-anchor="middle" fill="#4FC3F7" font-size="24" font-weight="600">Pal-Up</text>
</svg>
