<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A mod is one file: mod.lua declares, Palladium registers</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1A2028"/>

  <!-- mod.lua card -->
  <rect x="60" y="170" width="270" height="330" rx="12" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
  <text x="195" y="215" text-anchor="middle" fill="#FFB74D" font-size="26" font-weight="600">mod.lua</text>
  <g fill="#232B36" stroke="#3A4654" stroke-width="1.5">
    <rect x="85" y="245" width="220" height="48" rx="8"/>
    <rect x="85" y="305" width="220" height="48" rx="8"/>
    <rect x="85" y="365" width="220" height="48" rx="8"/>
    <rect x="85" y="425" width="220" height="48" rx="8"/>
  </g>
  <g fill="#C7D0DA" font-size="20" text-anchor="middle">
    <text x="195" y="275">permissions</text>
    <text x="195" y="335">settings</text>
    <text x="195" y="395">data</text>
    <text x="195" y="455">commands + events</text>
  </g>

  <!-- restart arrow -->
  <line x1="335" y1="335" x2="465" y2="335" stroke="#64748B" stroke-width="2" marker-end="url(#ah)"/>
  <text x="400" y="320" text-anchor="middle" fill="#8CA0B3" font-size="18">restart</text>

  <!-- Palladium -->
  <rect x="475" y="280" width="230" height="110" rx="12" fill="#232B36" stroke="#FFB74D" stroke-width="2"/>
  <text x="590" y="343" text-anchor="middle" fill="#FFB74D" font-size="28" font-weight="600">Palladium</text>

  <!-- four results -->
  <g fill="#232B36" stroke="#3A4654" stroke-width="1.5">
    <rect x="800" y="120" width="420" height="64" rx="10"/>
    <rect x="800" y="250" width="420" height="64" rx="10"/>
    <rect x="800" y="380" width="420" height="64" rx="10"/>
    <rect x="800" y="510" width="420" height="64" rx="10"/>
  </g>
  <g fill="#C7D0DA" font-size="20" text-anchor="middle">
    <text x="1010" y="159">registered in permissions.config</text>
    <text x="1010" y="289">settings.config the operator edits</text>
    <text x="1010" y="419">storage that survives restarts</text>
    <text x="1010" y="549">chat commands, gated and rate-limited</text>
  </g>
  <g stroke="#64748B" stroke-width="2" marker-end="url(#ah)">
    <line x1="705" y1="305" x2="795" y2="160"/>
    <line x1="705" y1="325" x2="795" y2="284"/>
    <line x1="705" y1="350" x2="795" y2="406"/>
    <line x1="705" y1="370" x2="795" y2="534"/>
  </g>

  <!-- caption -->
  <rect x="380" y="632" width="520" height="50" rx="10" fill="#232B36" stroke="#3A4654" stroke-width="1.5"/>
  <text x="640" y="664" text-anchor="middle" fill="#8CA0B3" font-size="20">declare it — the framework does the rest</text>
</svg>
