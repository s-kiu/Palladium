name: docs

# The docs site republishes itself: any push that touches docs/ or the site
# config rebuilds and deploys to GitHub Pages. The generated capability
# reference is committed by the same pushes that change the manifest, so the
# site is always the shipped truth. One-time setup in the repository:
# Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/studio/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      # The Studio is the front door: it is what an operator without a panel
      # actually opens. The documentation is a whole site of its own and moves
      # one level down, linked from the Studio and the README.
      # Strict, with no fallback: a broken link should fail the build rather
      # than publish a site that quietly has one.
      - run: mkdocs build --strict
      - run: |
          mkdir -p published/docs
          cp -r site/. published/docs/
          cp -r packages/studio/. published/
          rm -rf published/test published/README.md
      - run: rm -rf site && mv published site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
