name: mod-release

# Every mod that ships here is a normal mod: somebody running a Palworld server
# without pal-up should be able to download one and drop it in. Each mod holds
# exactly one release, updated in place: bump the version in the manifest and
# a push replaces that mod's release — same tag, new zip, title carrying the
# version — so the releases page lists one entry per mod, always current.
# History lives in git; the releases page is a download counter, not an
# archive.
#
# Three shapes, three places the version lives:
#   Info.json  a UE4SS mod (Palladium itself)
#   mod.lua    a Palladium mod
#   mod.json   a script mod the panel runs

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - '.github/workflows/mod-release.yaml'
  # Run it by hand from the Actions tab: useful for re-cutting a release
  # without a dummy commit, and the quickest way to tell whether Actions is
  # switched on at all — no button means it is not.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # One mod failing to publish must not stop the others.
      fail-fast: false
      matrix:
        mod: [Palladium, GoldStreak, WelcomeKit, TimedRewards, Leaderboards]
    steps:
      - uses: actions/checkout@v4

      - name: read the mod version
        id: mod
        run: |
          dir="mods/${{ matrix.mod }}"
          slug="$(echo "${{ matrix.mod }}" | tr '[:upper:]' '[:lower:]')"
          if [ -f "$dir/Info.json" ]; then
            version="$(jq -er '.Version' "$dir/Info.json")"
          elif [ -f "$dir/mod.json" ]; then
            version="$(jq -er '.version' "$dir/mod.json")"
          elif [ -f "$dir/mod.lua" ]; then
            # The manifest is a Lua table, so the version is read the way any
            # other tool would have to read it: the first version = "..." line.
            version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/mod.lua" | head -1)"
          else
            echo "no manifest in $dir" >&2; exit 1
          fi
          case "$version" in
            *[!0-9.a-zA-Z-]*|'') echo "refusing unsafe version string: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$slug" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: skip if the release already carries this version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh release view "${{ steps.mod.outputs.tag }}" --json name -q .name 2>/dev/null || true)"
          if [ "$current" = "${{ matrix.mod }} ${{ steps.mod.outputs.version }}" ]; then
            echo "release is already at this version — bump the manifest to replace it"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Palladium carries the suite that covers every mod here, including the
      # two driven end to end, so it runs whichever mod is being released.
      - name: test
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          mods/Palladium/test/run-tests.sh

      - name: package
        if: steps.check.outputs.exists == 'false'
        run: |
          # Archive root is the mod folder itself, so unzipping into ./mods (or
          # a server's Mods directory) lands it at the path the loader expects.
          # Tests are not part of what a server runs.
          zip -r "${{ matrix.mod }}-${{ steps.mod.outputs.version }}.zip" "${{ steps.mod.outputs.dir }}" \
            -x '*/.disabled' '*/test/*'
          sha256sum "${{ matrix.mod }}-${{ steps.mod.outputs.version }}.zip" \
            > "${{ matrix.mod }}-${{ steps.mod.outputs.version }}.zip.sha256"

      - name: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          dir="${{ steps.mod.outputs.dir }}"
          {
            if [ -f "$dir/mod.json" ]; then
              echo "A script mod: it runs in the pal-up panel, not in the game."
              echo
              echo "Drop the \`${{ matrix.mod }}\` folder from the archive into \`./mods\` — the panel picks it up within ten seconds."
            elif [ -f "$dir/mod.lua" ]; then
              echo "A Palladium mod. Needs [Palladium](https://github.com/${{ github.repository }}/releases?q=palladium) and nothing else."
              echo
              echo "Drop the \`${{ matrix.mod }}\` folder from the archive in beside Palladium and restart the server."
            else
              echo "The modding framework: it loads other mods, and publishes in-game events and actions for tools outside the game."
              echo
              echo "Drop the \`${{ matrix.mod }}\` folder from the archive into your server's UE4SS \`Mods\` directory (pal-up users: into \`./mods\`) and restart."
            fi
            echo
            echo "Writing a mod: [docs/mods.md](https://github.com/${{ github.repository }}/blob/main/docs/mods.md)"
          } > release-notes.md

      - name: publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Replace, not append: the old release and its tag go, the new one
          # takes the same tag on the released commit. Palladium wears the
          # repository's Latest badge; the mods never claim it.
          gh release delete "${{ steps.mod.outputs.tag }}" --cleanup-tag --yes 2>/dev/null || true
          if [ "${{ matrix.mod }}" = "Palladium" ]; then latest=true; else latest=false; fi
          gh release create "${{ steps.mod.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ matrix.mod }} ${{ steps.mod.outputs.version }}" \
            --latest=$latest \
            --notes-file release-notes.md \
            "${{ matrix.mod }}-${{ steps.mod.outputs.version }}.zip" \
            "${{ matrix.mod }}-${{ steps.mod.outputs.version }}.zip.sha256"
