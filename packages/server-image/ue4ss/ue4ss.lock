# Pinned UE4SS Linux (Palworld fork) release — the mod-loading foundation.
# Managed by vendor.sh:
#   ./vendor.sh              fetch the artifact (if absent) and verify it
#   ./vendor.sh --pin [TAG]  switch to a release and record its checksum
# "{tag}" inside UE4SS_ARTIFACT is replaced with UE4SS_TAG.
# An empty UE4SS_SHA256 means unpinned: image builds then omit UE4SS entirely.
#
# Current pin: the Qiiks fork release — carries the full set of Linux
# stability fixes for Palworld build 24466863 (upstream
# BlackBookOfficial/ue4ss-linux-palworld issues #1/#11; fixes are being
# upstreamed, switch back to an upstream release once one ships them).
# The sha256 below is the digest GitHub publishes for the release asset.
UE4SS_REPO=Qiiks/ue4ss-linux-palworld
UE4SS_TAG=v1.0.3-palworld-linux
UE4SS_ARTIFACT=ue4ss-linux-palworld-{tag}.tar.gz
UE4SS_SHA256=59becf74f69537e2d675eb2d1b61285251e8a7285d147dbdc62388d093b5c716
